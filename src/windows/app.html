<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>pet</title>
    <!-- <script src="../service/config.js"></script> -->
    <!-- <script src="./js/init.js"></script> -->
    <style>
        /* //动画 */
        @keyframes loading {

            /*  旋转 */
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .iconActive {
            animation-name: loading;
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        #app,
        #router,
        html,
        body {
            background-color: transparent !important;
        }
        /* Ruffle: 让鼠标事件穿透到下层 #move div */
        ruffle-player {
            pointer-events: none !important;
        }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden",
            warnOnUnsupportedContent: false,
            splashScreen: false,
            polyfills: true,
            letterbox: "off",
            wmode: "transparent",
            // 固定用 canvas 渲染器。WebGL 渲染器的画布内容读不回来
            // （drawImage 拿到空白），会让「抓当前帧」时灵时不灵，
            // 于是切动作时一会儿定格旧画面、一会儿让旧动画继续演。
            // 宠物尺寸很小，canvas 渲染器的性能完全够，换来的是行为可预期。
            preferredRenderer: "canvas"
        };
    </script>
    <script src="./js/ruffle/ruffle.js"></script>
</head>

<body>
    <div id="app" class="drag defaultAppStyle" style="display:none;opacity: 0;transition: 1s;user-select: none;">
        <div id="router">not router</div>
    </div>
</body>

</html>
